<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Buy More | FinSight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/investments.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white">

            <h3>
                Buy More {{ investment.investment_name }}
            </h3>

        </div>

        <div class="card-body">

            <p>
                <strong>Current Quantity:</strong>
                {{ investment.quantity }}
            </p>

            <p>
                <strong>Average Buy Price:</strong>
                ₹ {{ "%.2f"|format(investment.buy_price) }}
            </p>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Quantity to Buy
                    </label>

                    <input type="number"
                           name="quantity"
                           class="form-control"
                           step="0.01"
                           min="0.01"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Buy Price Per Unit
                    </label>

                    <input type="number"
                           name="buy_price"
                           class="form-control"
                           step="0.01"
                           min="0.01"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Buy More

                </button>

                <a href="{{ url_for('holdings') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
