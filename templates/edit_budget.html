{% extends "layouts/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit Budget</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Budget Amount</label>

                    <input
                        type="number"
                        class="form-control"
                        name="budget_amount"
                        value="{{ budget.converted_amount }}"
                        required>

                </div>

                

                <div class="mb-3">

                    <label>Year</label>

                    <input
                        type="number"
                        class="form-control"
                        name="budget_year"
                        value="{{ budget.budget_year }}"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    Update Budget

                </button>

                <a href="/budgets"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
