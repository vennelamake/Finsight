{% extends "layouts/base.html" %}

{% block content %}

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | FinSight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/expenses.css') }}">



<div class="container mt-5">

    <div class="expense-card">

        <h2>Edit Expense</h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Amount</label>

                    <input type="number"
                           class="form-control"
                           name="amount"
                           value="{{ expense.converted_amount }}"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Category</label>

                    <input type="text"
                           class="form-control"
                           name="category"
                           value="{{ expense.category }}"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Payment Method</label>

                    <input type="text"
                           class="form-control"
                           name="payment_method"
                           value="{{ expense.payment_method }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Date</label>

                    <input type="date"
                           class="form-control"
                           name="expense_date"
                           value="{{ expense.expense_date }}"
                           required>

                </div>

                <div class="col-12 mb-3">

                    <label>Description</label>

                    <textarea
                        class="form-control"
                        rows="4"
                        name="description">{{ expense.description }}</textarea>

                </div>

            </div>

            <button class="btn btn-success">

                Update Expense

            </button>

            <a href="/expenses"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
