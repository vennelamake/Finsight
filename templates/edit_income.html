{% extends "layouts/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit Income</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Income Source</label>

                        <input
                            type="text"
                            class="form-control"
                            name="source"
                            value="{{ income.source }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Amount</label>

                        <input
                            type="number"
                            class="form-control"
                            name="amount"
                            value="{{ income.converted_amount }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Date</label>

                        <input
                            type="date"
                            class="form-control"
                            name="income_date"
                            value="{{ income.income_date }}"
                            required>

                    </div>

                    <div class="col-12 mb-3">

                        <label>Description</label>

                        <textarea
                            class="form-control"
                            name="description"
                            rows="4">{{ income.description }}</textarea>

                    </div>

                </div>

                <button class="btn btn-success">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Income

                </button>

                <a href="/income" class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
