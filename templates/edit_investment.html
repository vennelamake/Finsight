{% extends "layouts/base.html" %}

{% block content %}

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Investment | FinSight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/investments.css') }}">
<div class="container mt-5">

    <div class="expense-card">

        <h2 class="mb-4">Edit Investment</h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Investment Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="investment_name"
                        value="{{ investment.investment_name }}"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Investment Type
                    </label>

                    <select
                        class="form-select"
                        name="investment_type"
                        required>

                        {% for type in [
                            "Stock",
                            "Mutual Fund",
                            "ETF",
                            "Bond",
                            "Gold",
                            "Crypto",
                            "Fixed Deposit"
                        ] %}

                        <option
                            value="{{ type }}"
                            {% if investment.investment_type == type %}
                            selected
                            {% endif %}>

                            {{ type }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <div class="alert alert-info">

                Quantity and pricing information are managed through
                Buy More, Sell, and live market price updates.

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Investment

            </button>

            <a href="{{ url_for('holdings') }}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
