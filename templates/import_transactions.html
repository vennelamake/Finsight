{% extends "layouts/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Import Transactions</h2>

    <!-- CSV Upload -->
    <div class="card mb-4">
        <div class="card-header">
            <h5>Import from CSV</h5>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Upload CSV File</label>

                    <input
                        type="file"
                        class="form-control"
                        name="csv_file"
                        accept=".csv"
                        required>
                </div>

                <button class="btn btn-primary">
                    Import CSV
                </button>

            </form>

        </div>
    </div>


    <!-- Image Upload -->
    <div class="card">

        <div class="card-header">
            <h5>Import from Bank Statement Image</h5>
        </div>

        <div class="card-body">

            <form action="/import-image"
                  method="POST"
                  enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Upload Image</label>

                    <input
                        type="file"
                        class="form-control"
                        name="statement_image"
                        accept=".png,.jpg,.jpeg"
                        required>
                </div>

                <button class="btn btn-success">
                    Upload Image
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
