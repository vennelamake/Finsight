<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinSight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/sidebar.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard_new.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/expenses.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/reports.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/report_preview.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/settings.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body class="{{ theme }}">

<div class="main-container">

    {% if current_user.is_authenticated %}
        {% include 'includes/sidebar.html' %}
    {% endif %}

    <div class="content">

        {% if current_user.is_authenticated %}
            {% include 'includes/navbar.html' %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
