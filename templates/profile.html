<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | FinSight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/profile.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="mb-4">

        <a href="/dashboard" class="btn btn-outline-primary">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </a>

    </div>

    <div class="profile-card">

        <div class="profile-header">

            {% if user.profile_image and user.profile_image != "default.png" %}

                <img src="{{ url_for('static', filename='uploads/' + user.profile_image) }}"
                     class="profile-image">

            {% else %}

                <img src="{{ url_for('static', filename='images/default.png') }}"
                     class="profile-image">

            {% endif %}

            <h2>{{ user.fullname }}</h2>

            <p>{{ user.email }}</p>

        </div>

        <form method="POST"
              action="/update-profile"
              enctype="multipart/form-data">

            <div class="row">

                <div class="col-12 mb-3">

                    <label class="form-label">

                        Profile Picture

                    </label>

                    <input type="file"
                           name="profile_image"
                           class="form-control"
                           accept="image/*">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Full Name</label>

                    <input type="text"
                           class="form-control"
                           name="fullname"
                           value="{{ user.fullname }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Email</label>

                    <input type="email"
                           class="form-control"
                           value="{{ user.email }}"
                           readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Mobile</label>

                    <input type="text"
                           class="form-control"
                           name="mobile"
                           value="{{ user.mobile }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Occupation</label>

                    <input type="text"
                           class="form-control"
                           name="occupation"
                           value="{{ user.occupation or '' }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Monthly Income</label>

                    <input type="number"
                           class="form-control"
                           name="monthly_income"
                           value="{{ user.monthly_income or '' }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Income Source</label>

                    <input type="text"
                           class="form-control"
                           name="income_source"
                           value="{{ user.income_source or '' }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Risk Level</label>

                    <select class="form-select"
                            name="risk_level">

                        <option value="Low" {% if user.risk_level=="Low" %}selected{% endif %}>Low</option>

                        <option value="Medium" {% if user.risk_level=="Medium" %}selected{% endif %}>Medium</option>

                        <option value="High" {% if user.risk_level=="High" %}selected{% endif %}>High</option>

                    </select>

                </div>

                <div class="col-12 mb-3">

                    <label>Financial Goal</label>

                    <textarea
                        class="form-control"
                        rows="3"
                        name="financial_goal">{{ user.financial_goal or '' }}</textarea>

                </div>

            </div>

            <button type="submit"
                    class="btn btn-primary">

                Save Changes

            </button>

        </form>

    </div>

</div>

</body>

</html>
