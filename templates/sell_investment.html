<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sell Investment | FinSight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/investments.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white">

            <h3>
                Sell {{ investment.investment_name }}
            </h3>

        </div>

        <div class="card-body">

            <p>
                <strong>Available Quantity:</strong>

                {{ investment.quantity }}
            </p>

            <p>
                <strong>Latest Current Price:</strong>

                ₹ {{ "%.2f"|format(investment.current_price) }}
            </p>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Quantity to Sell
                    </label>

                    <input type="number"
                           name="quantity"
                           class="form-control"
                           step="0.01"
                           min="0.01"
                           max="{{ investment.quantity }}"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-danger">

                    Sell Investment

                </button>

                <a href="{{ url_for('holdings') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
